<!-- Modern Login Page -->
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card animate-fade-in">
      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="url(#gradient)"/>
            <path d="M8 12h16v8H8z" fill="white" opacity="0.9"/>
            <circle cx="12" cy="20" r="2" fill="white"/>
            <circle cx="20" cy="20" r="2" fill="white"/>
            <defs>
              <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#667eea"/>
                <stop offset="100%" style="stop-color:#764ba2"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>Bejelentkezés</h1>
        <p>Üdvözlünk vissza a CarGo-ban</p>
      </div>

      <!-- Login Form -->
      <form class="auth-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"/>
            </svg>
            Email cím
          </label>
          <input 
            type="email" 
            id="email" 
            name="email"
            class="form-control" 
            [(ngModel)]="credentials.email" 
            required
            placeholder="pelda&#64;email.com"
            autocomplete="email"
          >
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
            </svg>
            Jelszó
          </label>
          <input 
            type="password" 
            id="password" 
            name="password"
            class="form-control" 
            [(ngModel)]="credentials.password" 
            required
            placeholder="Jelszó"
            autocomplete="current-password"
          >
        </div>

        <!-- Forgot Password Link -->
        <div class="form-options">
          <button type="button" class="forgot-password-link" (click)="toggleForgotForm()">
            Elfelejtett jelszó?
          </button>
        </div>

        <!-- Forgot Password Form -->
        <div class="forgot-password-form" *ngIf="showForgotForm">
          <div class="form-group">
            <label for="forgotEmail" class="form-label">Email cím a jelszó visszaállításhoz</label>
            <input
              type="email"
              id="forgotEmail"
              name="forgotEmail"
              class="form-control"
              [(ngModel)]="forgotEmail"
              placeholder="pelda&#64;email.com"
              autocomplete="email"
            >
          </div>
          <button
            type="button"
            class="btn btn-secondary btn-lg auth-submit"
            [disabled]="!forgotEmail || isForgotSubmitting"
            (click)="onForgotPassword()"
          >
            <span *ngIf="isForgotSubmitting" class="spinner"></span>
            {{ isForgotSubmitting ? 'Küldés...' : 'Ideiglenes jelszó küldése' }}
          </button>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-primary btn-lg auth-submit"
          [disabled]="!loginForm.form.valid || isSubmitting"
        >
          <span *ngIf="isSubmitting" class="spinner"></span>
          <svg *ngIf="!isSubmitting" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
            <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
          </svg>
          {{ isSubmitting ? 'Bejelentkezés...' : 'Bejelentkezés' }}
        </button>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <p>
          Még nincs fiókod? 
          <a routerLink="/register" class="auth-link">Regisztráció</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Alert Messages -->
  <div class="alert-container" *ngIf="showMessage">
    <div class="alert animate-slide-in" [class.alert-success]="messageType === 'success'" [class.alert-danger]="messageType === 'error'">
      <svg *ngIf="messageType === 'success'" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.061L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
      </svg>
      <svg *ngIf="messageType === 'error'" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
      </svg>
      {{ messageText }}
    </div>
  </div>
</div>
