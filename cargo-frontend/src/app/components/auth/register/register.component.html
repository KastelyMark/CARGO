<!-- Modern Registration Page -->
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card animate-fade-in">
      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="url(#gradient)"/>
            <path d="M8 12h16v8H8z" fill="white" opacity="0.9"/>
            <circle cx="12" cy="20" r="2" fill="white"/>
            <circle cx="20" cy="20" r="2" fill="white"/>
            <defs>
              <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#667eea"/>
                <stop offset="100%" style="stop-color:#764ba2"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>Regisztráció</h1>
        <p>Hozd létre a CarGo fiókodat</p>
      </div>

      <!-- Registration Form -->
      <form class="auth-form" (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <!-- Name Field -->
        <div class="form-group">
          <label for="name" class="form-label">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4Zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10Z"/>
            </svg>
            Teljes név
          </label>
          <input 
            type="text" 
            id="name" 
            name="name"
            class="form-control" 
            [(ngModel)]="userData.name" 
            required
            placeholder="Kovács János"
            autocomplete="name"
          >
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"/>
            </svg>
            Email cím
          </label>
          <input 
            type="email" 
            id="email" 
            name="email"
            class="form-control" 
            [(ngModel)]="userData.email" 
            required
            placeholder="pelda&#64;email.com"
            autocomplete="email"
          >
        </div>

        <!-- Phone Field with Country Code -->
        <div class="form-group">
          <label for="phone" class="form-label">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.568 17.568 0 0 0 4.168 6.608 17.569 17.569 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.678.678 0 0 0-.58-.122L9.98 10.97a.678.678 0 0 1-.358-.063l-5.194-2.03a.678.678 0 0 1-.063-.358l.537-1.804a.678.678 0 0 0-.122-.58L1.973 3.86a.678.678 0 0 0-.319-.532z"/>
            </svg>
            Telefonszám
          </label>
          <div class="phone-input-group">
            <div class="country-selector" [class.open]="showCountryDropdown">
              <button 
                type="button" 
                class="country-button" 
                (click)="toggleCountryDropdown()"
              >
                <span class="country-flag">{{ getSelectedCountry().flag }}</span>
                <span class="country-code">{{ getSelectedCountry().code }}</span>
                <svg class="chevron" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                </svg>
              </button>
              
              <div class="country-dropdown" *ngIf="showCountryDropdown">
                <div 
                  class="country-option" 
                  *ngFor="let country of countryCodes"
                  (click)="selectCountryCode(country)"
                >
                  <span class="country-flag">{{ country.flag }}</span>
                  <span class="country-name">{{ country.name }}</span>
                  <span class="country-code">{{ country.code }}</span>
                </div>
              </div>
            </div>
            
            <input 
              type="tel" 
              id="phone" 
              name="phone"
              class="form-control phone-input" 
              [(ngModel)]="userData.phone" 
              required
              placeholder="30 123 4567"
              autocomplete="tel"
            >
          </div>
          <div class="form-hint">
            Példa: 30 123 4567 (országkód nélkül)
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
            </svg>
            Jelszó
          </label>
          <input 
            type="password" 
            id="password" 
            name="password"
            class="form-control" 
            [(ngModel)]="userData.password" 
            required
            minlength="6"
            placeholder="Minimum 6 karakter"
            autocomplete="new-password"
          >
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
            </svg>
            Jelszó megerősítése
          </label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword"
            class="form-control" 
            [(ngModel)]="userData.confirmPassword" 
            required
            placeholder="Jelszó újra"
            autocomplete="new-password"
          >
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-primary btn-lg auth-submit"
          [disabled]="!registerForm.form.valid || isSubmitting"
        >
          <span *ngIf="isSubmitting" class="spinner"></span>
          <svg *ngIf="!isSubmitting" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4Zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10Z"/>
          </svg>
          {{ isSubmitting ? 'Regisztráció...' : 'Fiók létrehozása' }}
        </button>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <p>
          Már van fiókod? 
          <a routerLink="/login" class="auth-link">Bejelentkezés</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Alert Messages -->
  <div class="alert-container" *ngIf="showMessage">
    <div class="alert animate-slide-in" [class.alert-success]="messageType === 'success'" [class.alert-danger]="messageType === 'error'">
      <svg *ngIf="messageType === 'success'" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.061L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
      </svg>
      <svg *ngIf="messageType === 'error'" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
      </svg>
      {{ messageText }}
    </div>
  </div>

  <!-- Background Overlay -->
  <div class="country-overlay" *ngIf="showCountryDropdown" (click)="showCountryDropdown = false"></div>
</div>
