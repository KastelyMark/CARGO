<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CARGO</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="../logo.png" type="image/png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="logo.png" alt="" width="50px" height="50px" style="border-radius: 60px;"> CARGO
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link">Főoldal</a>
                </li>
                <li class="nav-item">
                    <a href="cars.html" class="nav-link">Autók</a>
                </li>
                <li class="nav-item">
                    <a href="/#contact" class="nav-link">Kapcsolat</a>
                </li>
                <li class="nav-item">
                    <span class="nav-link user-info" id="userInfo">Üdvözöljük!</span>
                </li>
                <li class="nav-item">
                    <button class="btn btn-secondary" id="logoutBtn">Kijelentkezés</button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="dashboard-container">
        <div class="container">
            <h1 class="dashboard-title">Üdvözöljük a dashboard-on!</h1>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <i class="fas fa-car"></i>
                    <h3 id="totalRentals">0</h3>
                    <p>Összes bérlés</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-clock"></i>
                    <h3 id="pendingRentals">0</h3>
                    <p>Függőben lévő</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle"></i>
                    <h3 id="completedRentals">0</h3>
                    <p>Befejezett</p>
                </div>
            </div>

            <div class="dashboard-section">
                <h2>Bérléseim</h2>
                <div class="rentals-container" id="rentalsContainer">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Bérlések betöltése...</p>
                    </div>
                </div>
            </div>

            <div class="dashboard-actions">
                <button class="btn btn-primary" onclick="showRentalModal('Válassz autót', 'Válassz árat')">
                    <i class="fas fa-plus"></i> Új bérlés
                </button>
            </div>
        </div>
    </div>

    <!-- Rental Modal -->
    <div id="rentalModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Autó bérlése</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="rentalForm" class="rental-form">
                    <div class="form-group">
                        <label for="carSelect">Autó</label>
                        <select id="carSelect" name="carId" required>
                            <option value="">Válassz autót...</option>
                            <!-- Cars will be loaded dynamically from database -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="carPrice">Ár (Ft/nap)</label>
                        <input type="text" id="carPrice" name="carPrice" readonly placeholder="Autó kiválasztása után jelenik meg">
                    </div>
                    <div class="form-group">
                        <label for="rentalDate">Bérlés kezdete</label>
                        <input type="date" id="rentalDate" name="rentalDate" required>
                    </div>
                    <div class="form-group">
                        <label for="returnDate">Visszahozatal dátuma</label>
                        <input type="date" id="returnDate" name="returnDate" required>
                    </div>
                    <div class="form-group">
                        <label for="customerName">Név</label>
                        <input type="text" id="customerName" name="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="customerEmail">Email</label>
                        <input type="email" id="customerEmail" name="customerEmail" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Bérlés elküldése</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
